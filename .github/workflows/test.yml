name: test

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  python-unit:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python unit tests
        run: python -X utf8 -m unittest discover -s tests -p "test_*.py" -v

  windows-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install validation dependency
        run: python -m pip install PyYAML
      - name: Runtime layout parity
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/test-runtime-layout.ps1
      - name: Runtime asset metadata
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/verify-runtime-assets.ps1
      - name: Skill static contract
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/static-contract.ps1
      - name: Skill package validation
        run: python -X utf8 tests/quick_validate_skill.py .
      - name: Diff hygiene
        run: git diff --check

  real-runtime-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\.ci-runtime
          key: btr-runtime-${{ runner.os }}-${{ hashFiles('scripts/runtime-assets.json') }}
      - name: Bootstrap real pinned runtime
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/bootstrap_runtime.ps1 -RuntimeRoot "$env:GITHUB_WORKSPACE\.ci-runtime"
      - name: Verify installed runtime again
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/bootstrap_runtime.ps1 -RuntimeRoot "$env:GITHUB_WORKSPACE\.ci-runtime" -VerifyOnly
